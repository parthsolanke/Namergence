[package]
name = "namergence"
version = "0.1.0"
edition = "2021"

[lib]
name = "namergence"
path = "src/lib.rs"

[[bin]]
name = "namergence-server"
path = "src/main.rs"

[[bin]]
name = "namergence-train"
path = "src/train.rs"

[dependencies]
axum = "0.7"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
unicode-normalization = "0.1"
